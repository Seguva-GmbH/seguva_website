name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to request the OIDC token

concurrency:
  group: deploy-website
  cancel-in-progress: false

env:
  # values of the output `website` of Seguva-GmbH/via-general/iac/_via_hub
  BUCKET: seguva-via-hub-website
  WORKLOAD_IDENTITY_PROVIDER: projects/111141163696/locations/global/workloadIdentityPools/github/providers/github-website
  SERVICE_ACCOUNT: github-website@seguva-via-hub.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # --checksums-only: a checkout sets all modification times to now, so compare by content instead
      # --exclude: files of the repo that are not part of the website (Python regex on the relative path)
      # --cache-control: Cloud CDN caches up to 5 minutes, so changes are visible after 5 minutes at the latest
      - name: Upload website
        run: |
          gcloud storage rsync . "gs://${BUCKET}" \
            --recursive \
            --delete-unmatched-destination-objects \
            --checksums-only \
            --exclude='^(\.git/|\.github/|\.gitignore$|README\.md$|docs/|locales/.*_old\.json$)' \
            --cache-control='public, max-age=300'
